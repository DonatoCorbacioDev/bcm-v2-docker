#
# The VM's journal, where the containers' logs go (docker-compose.prod.yml,
# journald driver). Installed as /etc/systemd/journald.conf.d/bcm.conf by
# apply-host-hardening.sh.
# Storage=persistent: on disk, across reboots (Ubuntu's default already, with
# /var/log/journal; stated so a new VM cannot differ).
# SystemMaxUse=2G: a ceiling on the disk it takes, the oldest entries going
# first (OWASP Logging Cheat Sheet: a log must not fill the disk).
# MaxRetentionSec=180day: the audit log's own retention (AuditLogRetentionService).
# The logs hold usernames and IP addresses, personal data kept no longer than
# the evidence they are.
[Journal]
Storage=persistent
SystemMaxUse=2G
MaxRetentionSec=180day
