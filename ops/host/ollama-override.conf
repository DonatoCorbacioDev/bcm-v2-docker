#
# /etc/systemd/system/ollama.service.d/override.conf on the VM (installed by
# apply-host-hardening.sh). Ollama runs on the host, not in a container; ml and
# the backend reach it at host.docker.internal:11434, so it listens on every
# interface. The host firewall then lets only the containers' "app" network
# (172.18.0.0/16) in on that port, and nothing from outside.
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
