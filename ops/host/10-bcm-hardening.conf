# SSH on the production VM (OWASP Database Security, network hardening of the
# host MySQL runs on). Installed as /etc/ssh/sshd_config.d/10-bcm-hardening.conf
# by ops/host/apply-host-hardening.sh. sshd keeps the first value it reads, and
# reads this directory in order, so 10- wins over the image's 60-cloudimg-settings.

# Only the administrator's account, with its key; never root, never a password.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
# Three wrong keys and the connection ends.
MaxAuthTries 3
# Nothing tunnels through this host: no forwarded ports, X11 or agent.
AllowTcpForwarding no
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
