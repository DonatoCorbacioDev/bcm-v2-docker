# Production overrides for bcm-prod (Oracle VM, 2 OCPU/12GB).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  mysql:
    deploy:
      resources:
        limits:
          memory: 1.5G

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FRONTEND_BASE_URL: https://bcm.donatocorbacio.dev
      BACKEND_BASE_URL: https://bcm.donatocorbacio.dev/api/v1
      # The public demo login (printed on the landing page) can't change its
      # password, turn on two-factor, pay invoices or edit their bank details:
      # it is shared by every visitor. demo-reset.sh sets the password as admin.
      BCM_DEMO_LOCKED_USERNAME: demo
      # Ollama runs on the VM host itself (no GPU, ARM CPU). Linux Docker has
      # no automatic host.docker.internal DNS like Docker Desktop — this
      # extra_hosts entry is what makes the name resolve here.
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://bcm.donatocorbacio.dev/api/v1
    environment:
      NEXT_PUBLIC_API_URL: https://bcm.donatocorbacio.dev/api/v1
    deploy:
      resources:
        limits:
          memory: 1G

  ml:
    environment:
      # Refuses to start without INTERNAL_API_KEY and INTERNAL_CLAIMS_PUBLIC_KEY.
      ENVIRONMENT: production
      CORS_ORIGINS: https://bcm.donatocorbacio.dev
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
