# Production overrides for bcm-prod (Oracle VM, 2 OCPU/12GB). CPU limits
# (OWASP Docker Security, resource limits): none can take both CPUs, so one
# busy container (clamd scanning, a forecast, the JVM) leaves room for the
# others; together they may exceed 2, which is a ceiling each, not a share.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Secrets are Docker secrets here (OWASP Secrets Management Cheat Sheet): one
# file each in ./secrets (directory 700, files 444, never in Git), mounted
# read-only at /run/secrets/<NAME> in the containers that need it and nowhere
# else, never environment variables, which `docker inspect` and every child
# process would see. A missing file stops the command and names it.
# ops/secrets/move-secrets-from-env.sh moved them there from .env once.
# docker-compose.yml passes the same secrets as variables, with public
# example values, so a laptop starts with no setup: `!reset` removes those
# variables here, otherwise even an empty one would win over the file.
# Names and settings that are not secret stay in .env (${VAR:?...}).
secrets:
  DB_ROOT_PASSWORD:
    file: ./secrets/DB_ROOT_PASSWORD
  DB_PASSWORD:
    file: ./secrets/DB_PASSWORD
  DB_APP_PASSWORD:
    file: ./secrets/DB_APP_PASSWORD
  ML_DB_URL:
    file: ./secrets/ML_DB_URL
  JWT_SECRET:
    file: ./secrets/JWT_SECRET
  JWT_SECRET_PREVIOUS:
    file: ./secrets/JWT_SECRET_PREVIOUS
  TOTP_ENCRYPTION_KEY:
    file: ./secrets/TOTP_ENCRYPTION_KEY
  MAIL_PASSWORD:
    file: ./secrets/MAIL_PASSWORD
  ML_INTERNAL_API_KEY:
    file: ./secrets/ML_INTERNAL_API_KEY
  ML_CLAIMS_PRIVATE_KEY:
    file: ./secrets/ML_CLAIMS_PRIVATE_KEY
  # Empty files while unused: an empty INTERNAL_ADMIN_API_KEY disables the
  # /internal endpoints, and checkout is off without the Stripe keys.
  INTERNAL_ADMIN_API_KEY:
    file: ./secrets/INTERNAL_ADMIN_API_KEY
  STRIPE_SECRET_KEY:
    file: ./secrets/STRIPE_SECRET_KEY
  STRIPE_WEBHOOK_SECRET:
    file: ./secrets/STRIPE_WEBHOOK_SECRET
  # MySQL's TLS certificate and key, and the CA that signed it (OWASP Database
  # Security, secure connections), all written by ops/mysql/issue-tls-cert.sh,
  # which deletes the CA's key right after signing. The server certificate names
  # mysql and bcm-mysql, so the clients check the name too (VERIFY_IDENTITY).
  # The CA certificate is public, a file like the secrets so it reaches only the
  # services that connect: PEM for ml, PKCS12 for the JVM (its password protects
  # nothing, the store holding only that public certificate).
  MYSQL_SERVER_CERT:
    file: ./secrets/MYSQL_SERVER_CERT
  MYSQL_SERVER_KEY:
    file: ./secrets/MYSQL_SERVER_KEY
  MYSQL_CA_CERT:
    file: ./secrets/MYSQL_CA_CERT
  MYSQL_TRUSTSTORE:
    file: ./secrets/MYSQL_TRUSTSTORE

services:
  mysql:
    environment:
      # The image reads the *_FILE variants; it refuses both forms at once.
      MYSQL_ROOT_PASSWORD: !reset null
      MYSQL_PASSWORD: !reset null
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PASSWORD
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
    secrets:
      - DB_ROOT_PASSWORD
      - DB_PASSWORD
      - MYSQL_SERVER_CERT
      - MYSQL_SERVER_KEY
      - MYSQL_CA_CERT
    # docker-compose.yml's flags, plus the certificate from
    # ops/mysql/issue-tls-cert.sh instead of the one MySQL generates.
    command: ["--log-bin-trust-function-creators=1", "--mysqlx=OFF", "--require-secure-transport=ON",
              "--tls-version=TLSv1.3",
              "--ssl-ca=/run/secrets/MYSQL_CA_CERT", "--ssl-cert=/run/secrets/MYSQL_SERVER_CERT",
              "--ssl-key=/run/secrets/MYSQL_SERVER_KEY"]
    # Only its own internal network and no port on the VM (OWASP Docker
    # Security, network isolation): the ops scripts use docker exec.
    networks: !override
      - data
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"

  # The only container with the schema owner's password: it applies the
  # migrations and exits (docker-compose.yml).
  migrate:
    environment:
      # TLS with the server's certificate checked: its CA and its name (mysql).
      DB_URL: jdbc:mysql://mysql:3306/bcm?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/run/secrets/MYSQL_TRUSTSTORE&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=public-ca-only&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      # Read from /run/secrets/DB_PASSWORD (DatabaseMigration).
      DB_PASSWORD: !reset null
    secrets:
      - DB_PASSWORD
      - MYSQL_TRUSTSTORE

  backend:
    environment:
      # The row-only account the backend runs with and checks the migrations
      # with (ops/mysql/create-app-runtime-user.sh); no owner account here.
      DB_USERNAME: !reset null
      DB_APP_USERNAME: ${DB_APP_USERNAME:?run ops/mysql/create-app-runtime-user.sh}
      # TLS with the server's certificate checked: its CA and its name (mysql)
      # (SecurityStartupValidator refuses to start without it).
      DB_URL: jdbc:mysql://mysql:3306/bcm?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/run/secrets/MYSQL_TRUSTSTORE&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=public-ca-only&serverTimezone=UTC
      # Read from /run/secrets by Spring (configtree import in application.properties).
      DB_PASSWORD: !reset null
      DB_APP_PASSWORD: !reset null
      JWT_SECRET: !reset null
      JWT_SECRET_PREVIOUS: !reset null
      TOTP_ENCRYPTION_KEY: !reset null
      MAIL_PASSWORD: !reset null
      ML_INTERNAL_API_KEY: !reset null
      ML_CLAIMS_PRIVATE_KEY: !reset null
      INTERNAL_ADMIN_API_KEY: !reset null
      STRIPE_SECRET_KEY: !reset null
      STRIPE_WEBHOOK_SECRET: !reset null
      SPRING_PROFILES_ACTIVE: prod
      FRONTEND_BASE_URL: https://bcm.donatocorbacio.dev
      BACKEND_BASE_URL: https://bcm.donatocorbacio.dev/api/v1
      # The public demo login (printed on the landing page) can't change its
      # password, turn on two-factor, pay invoices or edit their bank details:
      # it is shared by every visitor. demo-reset.sh sets the password as admin.
      BCM_DEMO_LOCKED_USERNAME: demo
      # Every ADMIN must turn on 2FA before getting a session, except the demo's
      # internal admin: demo-reset.sh signs in as it with a password, every night.
      BCM_2FA_EXEMPT_USERNAMES: demo_admin
      # Every upload is scanned in production, whatever .env says.
      MALWARE_SCAN_ENABLED: "true"
      # Ollama runs on the VM host itself (no GPU, ARM CPU). Linux Docker has
      # no automatic host.docker.internal DNS like Docker Desktop — this
      # extra_hosts entry is what makes the name resolve here.
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      # The row-only account only: the owner's password stays with migrate.
      - DB_APP_PASSWORD
      - MYSQL_TRUSTSTORE
      - JWT_SECRET
      # Empty except while rotating JWT_SECRET (docs/SECURITY.md in the backend).
      - JWT_SECRET_PREVIOUS
      # Two-factor secrets at rest, never derived from JWT_SECRET.
      - TOTP_ENCRYPTION_KEY
      - MAIL_PASSWORD
      - ML_INTERNAL_API_KEY
      - ML_CLAIMS_PRIVATE_KEY
      - INTERNAL_ADMIN_API_KEY
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://bcm.donatocorbacio.dev/api/v1
    environment:
      NEXT_PUBLIC_API_URL: https://bcm.donatocorbacio.dev/api/v1
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  ml:
    environment:
      # Read from /run/secrets by its settings (app/config.py): DB_URL holds
      # its read-only account (ops/mysql/create-ml-readonly-user.sh), never
      # the backend's; INTERNAL_API_KEY is the backend's ML_INTERNAL_API_KEY.
      DB_URL: !reset null
      INTERNAL_API_KEY: !reset null
      # Refuses to start without INTERNAL_API_KEY, INTERNAL_CLAIMS_PUBLIC_KEY and DB_SSL_CA.
      ENVIRONMENT: production
      # TLS to MySQL with the server's certificate checked: its CA and its name.
      DB_SSL_CA: /run/secrets/MYSQL_CA_CERT
      CORS_ORIGINS: https://bcm.donatocorbacio.dev
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - source: ML_DB_URL
        target: DB_URL
      - source: ML_INTERNAL_API_KEY
        target: INTERNAL_API_KEY
      - MYSQL_CA_CERT
    # Reached only by the backend, inside Docker: no port on the VM.
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  clamav:
    deploy:
      resources:
        limits:
          # clamd holds the signatures in memory (about 1.2 GB) and, while it
          # loads a freshclam update, the new set next to the old one for a
          # moment: 2 GB would get it killed at the first daily reload.
          memory: 3G
          cpus: "1.0"

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

# The VM's firewall lets containers reach Ollama on the host (port 11434)
# from 172.18.0.0/16 only: the backend and ml reach it through app, so app
# keeps that subnet.
networks:
  app:
    ipam:
      config:
        - subnet: 172.18.0.0/16
  # Fixed too: the three application accounts accept connections from this
  # subnet only ('172.19.%', ops/mysql/harden-accounts.sh), so it must not change.
  data:
    ipam:
      config:
        - subnet: 172.19.0.0/16
