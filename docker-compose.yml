# DEV ONLY — this compose file is for local development, not production.
# Default secrets below are placeholders meant to be overridden via .env;
# see docs/PRODUCTION_CHECKLIST.md before deploying anywhere reachable
# outside your own machine.

# Container logs kept to 3 files of 10 MB each, per container (OWASP API4):
# Docker's default keeps them forever, until they fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every container (OWASP Docker Security Cheat Sheet): no Linux capability
# unless listed under its own cap_add, no gaining privileges through setuid
# binaries, a read-only root filesystem (what a service must write goes to a
# volume or a tmpfs), and a ceiling on processes against a fork bomb. Here,
# not only in production, so the CI smoke test runs the stack this way.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  # MySQL Database
  mysql:
    # MySQL 8.4 LTS, without the tools it never uses (mysql/Dockerfile).
    build:
      context: ./mysql
    container_name: bcm-mysql
    logging: *default-logging
    restart: unless-stopped
    <<: *hardening
    # Started as the mysql user (999, who owns the data volume): the
    # entrypoint then never switches users, and needs no capability at all.
    user: "999:999"
    tmpfs:
      - /tmp
      # Owned by mysql, which writes its socket and pid file there; 0755,
      # not tmpfs' default 1777, which mysqld warns about.
      - /run/mysqld:mode=0755,uid=999,gid=999
    deploy:
      resources:
        limits:
          pids: 512
    # Lets the owner account, which has no SUPER privilege, create triggers
    # with the binary log on (the backend's V60: audit_logs rows cannot be
    # changed). The risk it guards against is a replica diverging from the
    # primary; this setup has no replica.
    # --mysqlx=OFF: no X Protocol listener (port 33060), which nothing here
    # uses (OWASP Database Security, limit access to the server).
    command: ["--log-bin-trust-function-creators=1", "--mysqlx=OFF"]
    environment:
      # root only from inside the container (the ops scripts, the healthcheck:
      # docker exec, over the local socket), never over the network. Applies
      # when the data volume is first created; on an existing one,
      # ops/mysql/harden-accounts.sh drops root@'%'.
      MYSQL_ROOT_HOST: localhost
      # Empty defaults: in production these come from Docker secrets instead
      # (docker-compose.prod.yml), and .env no longer has them.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MYSQL_DATABASE: bcm
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # data: the database's own network, no way out. app only for the port
    # published to this laptop; production leaves it (docker-compose.prod.yml).
    networks:
      - data
      - app
    healthcheck:
      # Over TCP, without a password: healthy only once the real server
      # listens. On a new volume the image first runs a temporary server with
      # networking off, which the local socket already answers, so a socket
      # ping let migrate connect too early and fail (CI, 2026-11-19).
      # mysqladmin ping exits 0 whenever the server answers, even "access
      # denied", so it needs no account and reads no secret.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis — backs the distributed login/register rate limiter (RateLimitingFilter).
  # Not exposed beyond the compose network; nothing outside this stack talks to it.
  redis:
    image: redis:7-alpine
    container_name: bcm-redis
    logging: *default-logging
    restart: unless-stopped
    <<: *hardening
    # Entrypoint as root, then the redis user.
    cap_add: [CHOWN, SETGID, SETUID]
    # Nothing written to disk: it holds only rate-limit counters, which a
    # restart may safely reset.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          pids: 128
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ClamAV — the antivirus every uploaded file goes through before the backend
  # reads or stores it (OWASP File Upload Cheat Sheet, malware scanning).
  # Reached only inside the compose network (clamd on 3310), no port published.
  # The image ships with the signatures (copied into the volume on first start)
  # and freshclam inside it keeps them updated. Its own healthcheck reports
  # healthy once clamd has loaded them, a minute or two after starting; until
  # then uploads are refused with 503. The backend does not wait for it, so the
  # rest of the app is up meanwhile. The debian variant is the one with an arm64
  # build (the production VM).
  clamav:
    image: clamav/clamav:1.5.4-debian
    container_name: bcm-clamav
    logging: *default-logging
    restart: unless-stopped
    <<: *hardening
    # Its init runs as root and starts clamd and freshclam as the clamav user,
    # which keep no capability. On a new volume it needs all five to prepare
    # the signatures directory (without DAC_OVERRIDE and FOWNER freshclam
    # cannot save its state there).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /tmp
      - /run/clamav
      - /run/lock
      - /var/log/clamav
    deploy:
      resources:
        limits:
          pids: 256
    volumes:
      - clamav_db:/var/lib/clamav
    # app: freshclam needs the internet for the signatures; no database here.
    networks:
      - app

  # The schema migrations, applied and done (OWASP Database Security, the
  # application's account apart from the one that changes the schema): the
  # backend's own image and migrations, run as the schema owner by
  # DatabaseMigration, which then exits; the backend starts after it with the
  # row-only account and only checks them. Every `up` runs it first: deploy
  # with `up -d migrate backend`, not `--no-deps backend`, or a new migration
  # is never applied and the backend refuses to start.
  migrate:
    build:
      context: ../bcm-v2-backend
      dockerfile: Dockerfile
    container_name: bcm-migrate
    logging: *default-logging
    restart: "no"
    <<: *hardening
    entrypoint: ["java", "-Dloader.main=com.donatodev.bcm_backend.migration.DatabaseMigration",
                 "-cp", "app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    # The image's healthcheck is the backend's web endpoint, which this never serves.
    healthcheck:
      disable: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          pids: 128
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bcm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-bcm_user}
      DB_PASSWORD: ${DB_PASSWORD:-bcm_password}
    # The database alone: no way out.
    networks:
      - data

  # Spring Boot Backend
  backend:
    build:
      context: ../bcm-v2-backend
      dockerfile: Dockerfile
    container_name: bcm-backend
    logging: *default-logging
    restart: unless-stopped
    <<: *hardening
    # Runs as spring and needs no capability. /tmp: Tomcat's work files,
    # uploads being parsed, and native libraries (Brotli) the JVM extracts
    # and loads from there, hence exec.
    tmpfs:
      - /tmp:exec,size=512m
    deploy:
      resources:
        limits:
          pids: 512
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bcm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      # The migrations ran in migrate: Flyway here only checks them.
      FLYWAY_MIGRATE_ON_START: "false"
      # Owner account, on a laptop only for Flyway's check (production checks
      # with the row-only account and gives the backend no owner password).
      DB_USERNAME: ${DB_USERNAME:-bcm_user}
      DB_PASSWORD: ${DB_PASSWORD:-bcm_password}
      # The account the backend runs with: rows only (SELECT, INSERT, UPDATE,
      # DELETE), created by ops/mysql/create-app-runtime-user.sh. Without it
      # the owner account is used, so a fresh local setup keeps working.
      DB_APP_USERNAME: ${DB_APP_USERNAME:-${DB_USERNAME:-bcm_user}}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD:-bcm_password}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Antivirus for uploads (the clamav service above). Uploads fail closed:
      # with clamd unreachable they are refused, never stored unscanned.
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # One-off recheck of the files already stored, at this start: report only.
      UPLOAD_RESCAN_ENABLED: ${UPLOAD_RESCAN_ENABLED:-false}
      # Key rotation and two-factor encryption (both empty in development).
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # INSECURE DEFAULT — dev only. Override JWT_SECRET in .env for anything
      # beyond a throwaway local stack.
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-256-bits}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      SPRING_PROFILES_ACTIVE: dev
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Weekly abuse report (SecurityReportService); empty sends none.
      OPS_REPORT_EMAIL: ${OPS_REPORT_EMAIL:-}
      FRONTEND_BASE_URL: http://localhost:3000
      BACKEND_BASE_URL: http://localhost:8090/api/v1
      UPLOAD_DIR: /app/uploads
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      ML_FASTAPI_URL: http://ml:8000
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-}
      ML_CLAIMS_PRIVATE_KEY: ${ML_CLAIMS_PRIVATE_KEY:-}
      INTERNAL_ADMIN_API_KEY: ${INTERNAL_ADMIN_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Semantic document search — Spring AI calls Ollama on the host
      # directly, same host.docker.internal bridge the ml service uses below.
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      # Docker Desktop (Windows/Mac) resolves host.docker.internal by itself;
      # plain Docker Engine on Linux does not, and Ollama runs on the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - uploads_data:/app/uploads
    # data for MySQL and Redis; app for ClamAV, ml, mail, Stripe and Ollama.
    networks:
      - data
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Next.js Frontend
  frontend:
    build:
      context: ../bcm-v2-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8090/api/v1
    container_name: bcm-frontend
    logging: *default-logging
    restart: unless-stopped
    <<: *hardening
    # Runs as nextjs and needs no capability; writes nothing but /tmp.
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          pids: 256
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    # A network of its own: the browser calls the backend, the server never
    # does, so it reaches no other container.
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # FastAPI ML Service
  ml:
    build:
      context: ../bcm-v2-ml
      dockerfile: Dockerfile
    container_name: bcm-ml
    logging: *default-logging
    restart: unless-stopped
    <<: *hardening
    # Runs as ml and needs no capability. /tmp is its HOME (Dockerfile):
    # matplotlib's cache, Prophet's Stan output, gunicorn's control socket.
    tmpfs:
      - /tmp:size=256m
    deploy:
      resources:
        limits:
          pids: 256
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Its own read-only account when ML_DB_USERNAME/ML_DB_PASSWORD are set
      # (ops/mysql/create-ml-readonly-user.sh); the backend's account otherwise,
      # so a fresh local setup keeps working without the extra step.
      DB_URL: mysql+pymysql://${ML_DB_USERNAME:-${DB_USERNAME:-bcm_user}}:${ML_DB_PASSWORD:-${DB_PASSWORD:-bcm_password}}@mysql:3306/bcm
      CORS_ORIGINS: http://localhost:3000
      OLLAMA_URL: http://host.docker.internal:11434
      INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-}
      INTERNAL_CLAIMS_PUBLIC_KEY: ${INTERNAL_CLAIMS_PUBLIC_KEY:-}
    extra_hosts:
      # Docker Desktop (Windows/Mac) resolves host.docker.internal by itself;
      # plain Docker Engine on Linux does not, and Ollama runs on the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    # data for MySQL; app for the backend's calls and Ollama on the host.
    networks:
      - data
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Three networks instead of one (OWASP Docker Security, network isolation):
# each container reaches only what it talks to.
networks:
  # MySQL and Redis with the two services that use them; internal, so no
  # way out to the internet, and nothing else can reach the database.
  data:
    driver: bridge
    internal: true
  # backend, ml and ClamAV: the outside services they call and each other.
  app:
    driver: bridge
  # The frontend alone.
  web:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  clamav_db:
    driver: local