version: 2
updates:
  # GitHub Actions used in the workflows under .github/workflows/
  # (no package manifest of its own here — app dependencies are tracked in
  # each app's own repo: bcm-v2-backend, bcm-v2-frontend, bcm-v2-ml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # The MySQL image (mysql/Dockerfile): the next 8.4 patch release only. 8.4 is
  # the LTS line, fixes for years without new features; a newer major or an
  # Innovation release (9.x, 26.x) is an upgrade of the database, decided and
  # tested on its own, never a weekly pull request.
  # The ClamAV image (clamav/Dockerfile): the next 1.5 patch release only, as
  # MySQL's; a new minor or major version is decided and tested on its own.
  - package-ecosystem: "docker"
    directory: "/clamav"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "clamav/clamav"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/mysql"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
