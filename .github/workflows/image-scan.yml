name: Image scan

# OWASP Docker Security Cheat Sheet, image scanning: every image the stack
# runs, all six built here (backend, frontend, ml, and MySQL, ClamAV and
# Redis on their official images), checked for known vulnerabilities. On every push, and every Monday too: a new CVE needs
# no commit of ours to appear.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The official image, by digest (0.76.1): a tag can be moved, a digest
  # cannot. Dependabot does not update it; bump both together.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  scan:
    name: Trivy (HIGH and CRITICAL with a fix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bcm-v2-docker

    steps:
      - name: Checkout docker repo
        uses: actions/checkout@v7
        with:
          path: bcm-v2-docker

      # Siblings inside the workspace, as docker-compose.yml expects (see ci.yml).
      - name: Checkout backend repo
        uses: actions/checkout@v7
        with:
          repository: DonatoCorbacioDev/bcm-v2-backend
          path: bcm-v2-backend

      - name: Checkout frontend repo
        uses: actions/checkout@v7
        with:
          repository: DonatoCorbacioDev/bcm-v2-frontend
          path: bcm-v2-frontend

      - name: Checkout ml repo
        uses: actions/checkout@v7
        with:
          repository: DonatoCorbacioDev/bcm-v2-ml
          path: bcm-v2-ml

      # mysql, clamav and redis are built too, on their official images with the
      # system packages updated (mysql/Dockerfile, clamav/Dockerfile,
      # redis/Dockerfile): rebuilt here every Monday, they carry Oracle's,
      # Debian's and Alpine's latest fixes. migrate runs
      # the backend's own image, scanned once: every image `docker compose
      # config --images` lists must exist to be scanned.
      - name: Build every image
        run: docker compose build --pull mysql clamav redis backend frontend ml

      # Each image is handed to Trivy as a file (docker save): Trivy never
      # gets the Docker socket. It fails the job on a HIGH or CRITICAL
      # vulnerability that a newer package already fixes, which is one we can
      # act on (rebuild, bump the base image); unfixed ones are listed by the
      # report but cannot be acted on yet.
      # Each image's inventory too (OWASP ASVS 15.1, a software bill of
      # materials): every OS package and library in it, CycloneDX, kept as this
      # run's artifact, so what runs in production can be looked up when a new
      # vulnerability is published, without rebuilding anything.
      - name: Scan every image
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/images" "$RUNNER_TEMP/sboms"
          status=0
          for image in $(docker compose config --images | sort -u); do
            file="$RUNNER_TEMP/images/$(echo "$image" | tr '/:' '__').tar"
            docker save "$image" -o "$file"
            echo "::group::$image"
            docker run --rm \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$RUNNER_TEMP/images:/images:ro" \
              "$TRIVY_IMAGE" image --input "/images/$(basename "$file")" \
                --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --exit-code 1 --no-progress --format table \
              || { echo "::error::$image has HIGH/CRITICAL vulnerabilities with a fix available"; status=1; }
            docker run --rm \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$RUNNER_TEMP/images:/images:ro" \
              -v "$RUNNER_TEMP/sboms:/sboms" \
              "$TRIVY_IMAGE" image --input "/images/$(basename "$file")" \
                --format cyclonedx --no-progress \
                --output "/sboms/$(echo "$image" | tr '/:' '__').cdx.json"
            echo "::endgroup::"
            rm -f "$file"
          done
          exit $status

      - name: Keep the images' SBOMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-sboms
          path: ${{ runner.temp }}/sboms/
          retention-days: 90
